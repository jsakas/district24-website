server {
#     listen      8080;
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    # Astro builds one HTML file per page (e.g. /calendar/index.html),
    # so there is no single-page-app fallback to index.html any more.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
